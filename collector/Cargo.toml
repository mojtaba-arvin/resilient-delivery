[package]
name = "resilient-delivery-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false

[dependencies]
axum = { version = "0.7.9", features = ["json", "tokio", "http1"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
subtle = "2.6.1"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower-http = { version = "0.6.2", features = ["limit", "trace"] }

[dev-dependencies]
http-body-util = "0.1.2"
tower = { version = "0.5.2", features = ["util"] }
