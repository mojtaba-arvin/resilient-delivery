<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resilient Delivery · Collector</title>
<style>
:root{color-scheme:dark;font:15px/1.5 ui-sans-serif,system-ui,sans-serif;background:#10151d;color:#e8edf5}
body{margin:0;padding:2rem;max-width:1100px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0}small,.muted{color:#9aa8bb}
.controls{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.5rem 0}
input,button{border:1px solid #344256;background:#182230;color:inherit;border-radius:8px;padding:.65rem .8rem}
input{min-width:260px;flex:1}button{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:#182230;border:1px solid #29384b;border-radius:12px;padding:1rem}
.card span{display:block;color:#9aa8bb;font-size:.8rem}.card strong{font-size:1.7rem;font-variant-numeric:tabular-nums}
.status{margin:1rem 0;color:#9aa8bb}.status.error{color:#ff9b9b}
footer{margin-top:1.5rem;color:#9aa8bb;font-size:.85rem}
</style>
</head>
<body>
<header><h1>Resilient Delivery / Collector</h1><small id="updated">Not connected</small></header>
<div class="controls">
<input id="endpoint" value="http://127.0.0.1:8080/metrics" aria-label="Metrics endpoint">
<input id="token" type="password" autocomplete="off" placeholder="Collector bearer token" aria-label="Bearer token">
<button id="connect">Connect</button>
</div>
<p id="status" class="status">Metrics are fetched directly from your collector. The token is held in memory only.</p>
<section id="metrics" class="grid" aria-live="polite"></section>
<footer>Metrics endpoint is bearer-authenticated. Queue capacity is process-local. This page does not persist credentials or send telemetry.</footer>
<script>
const fields=[
["requests_total","Ingestion requests"],["batches_committed_total","Committed batches"],
["events_committed_total","Committed observations"],["batches_deduplicated_total","Deduplicated batches"],
["auth_failures_total","Authentication failures"],["invalid_batches_total","Invalid batches"],
["rate_limited_total","Rate-limited"],["queue_rejected_total","Queue rejections"],
["storage_errors_total","Storage errors"],["idempotency_conflicts_total","Idempotency conflicts"],
["queue_available","Queue slots available"],["queue_capacity","Queue capacity"]
];
const root=document.querySelector("#metrics"),status=document.querySelector("#status"),updated=document.querySelector("#updated");
root.innerHTML=fields.map(([key,label])=>'<article class="card"><span>'+label+'</span><strong id="'+key+'">—</strong></article>').join("");
let timer;
async function poll(){
 const endpoint=document.querySelector("#endpoint").value.trim(),token=document.querySelector("#token").value;
 try{
  const response=await fetch(endpoint,{headers:{Authorization:"Bearer "+token},cache:"no-store"});
  if(!response.ok)throw new Error("Collector returned HTTP "+response.status);
  const data=await response.json();
  for(const [key] of fields)document.getElementById(key).textContent=Number(data[key]??0).toLocaleString();
  status.className="status";status.textContent="Connected · refreshing every 5 seconds";
  updated.textContent="Updated "+new Date().toLocaleTimeString();
 }catch(error){status.className="status error";status.textContent=error.message;}
}
document.querySelector("#connect").addEventListener("click",()=>{clearInterval(timer);void poll();timer=setInterval(poll,5000);});
</script>
</body>
</html>
