services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: resilient-delivery-collector:local
    restart: unless-stopped
    environment:
      COLLECTOR_BIND: "0.0.0.0:8080"
      COLLECTOR_DATABASE_PATH: "/data/collector.duckdb"
      COLLECTOR_PARQUET_PATH: "/data/telemetry.parquet"
      COLLECTOR_RETENTION_DAYS: "${COLLECTOR_RETENTION_DAYS:-0}"
      COLLECTOR_RATE_CAPACITY: "${COLLECTOR_RATE_CAPACITY:-30}"
      COLLECTOR_RATE_PER_SECOND: "${COLLECTOR_RATE_PER_SECOND:-2}"
      COLLECTOR_BEARER_TOKEN: '${COLLECTOR_BEARER_TOKEN:-}'
    volumes:
      - collector-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      COLLECTOR_DOMAIN: "${COLLECTOR_DOMAIN:?set COLLECTOR_DOMAIN to a public DNS name}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - collector
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  otlp-json-adapter:
    image: node:22-alpine
    profiles: ["otlp"]
    user: "1000:1000"
    working_dir: /app
    command: ["node", "integration/otlp-json-adapter.mjs"]
    environment:
      OTLP_ADAPTER_BIND: "0.0.0.0"
      OTLP_ADAPTER_PORT: "4319"
      COLLECTOR_URL: "http://collector:8080/v1/telemetry/batches"
      COLLECTOR_BEARER_TOKEN: "${COLLECTOR_BEARER_TOKEN:?set COLLECTOR_BEARER_TOKEN}"
    volumes:
      - ./integration:/app/integration:ro
    depends_on:
      - collector
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["otlp"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./integration/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - otlp-json-adapter
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

volumes:
  collector-data:
  caddy-data:
  caddy-config:
