services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: resilient-delivery-collector:local
    restart: unless-stopped
    environment:
      COLLECTOR_BIND: "0.0.0.0:8080"
      COLLECTOR_DATABASE_PATH: "/data/collector.duckdb"
      COLLECTOR_PARQUET_PATH: "/data/telemetry.parquet"
      COLLECTOR_RETENTION_DAYS: "${COLLECTOR_RETENTION_DAYS:-0}"
      COLLECTOR_BEARER_TOKEN: '${COLLECTOR_BEARER_TOKEN:-}'
      COLLECTOR_TENANT_TOKENS: '${COLLECTOR_TENANT_TOKENS:-}'
    volumes:
      - collector-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      COLLECTOR_DOMAIN: "${COLLECTOR_DOMAIN:?set COLLECTOR_DOMAIN to a public DNS name}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - collector
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  collector-data:
  caddy-data:
  caddy-config:
