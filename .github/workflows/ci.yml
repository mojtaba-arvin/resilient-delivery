name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  rust-collector:
    runs-on: ubuntu-latest
    env:
      # DuckDB 1.2.2's bundled Thrift headers use fixed-width integer types
      # without including <cstdint> themselves. Inject the standard header
      # for every C++ translation unit compiled by cc/libduckdb-sys.
      CXXFLAGS: -include cstdint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path collector/Cargo.toml -- --check
      - run: cargo clippy --manifest-path collector/Cargo.toml --all-targets -- -D warnings
      # Keep native DuckDB compilation/test stalls bounded and preserve test-stage output.
      - name: Run Rust tests (serialized, with diagnostics)
        timeout-minutes: 35
        run: cargo test --manifest-path collector/Cargo.toml -- --test-threads=1 --nocapture
      - run: cargo build --release --manifest-path collector/Cargo.toml
